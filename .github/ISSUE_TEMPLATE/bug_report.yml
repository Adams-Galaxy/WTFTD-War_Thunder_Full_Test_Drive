name: Bug report
description: Something doesn't work in WTFTD or in the mission it created
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more precise, the faster it gets fixed.
        Tip: in WTFTD click **Share** next to *Create mission* and paste the code below — it lets us rebuild your exact setup.
        The quickest way: **Settings → Feedback** in the app fills in this form for you.
        Please follow our [code of conduct](https://github.com/StonewarP/WTFTD-War_Thunder_Full_Test_Drive/blob/main/CODE_OF_CONDUCT.md).
  - type: input
    id: version
    attributes:
      label: WTFTD version
      description: Settings → bottom of the window (e.g. 0.25.2)
      placeholder: "0.25.2"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - In WTFTD (the app)
        - In game, in the mission WTFTD created
        - In flight (overlay, alarms, HUD, minimap, flight data, battle)
        - Test bench or Challenges
        - My hangar, My battles or What changed
        - Skins and sounds
        - 3D views
        - First launch / game data
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead. Screenshots welcome.
      placeholder: |
        1. Picked the F-16C, put a B61 on pylon 5, Midway scenario
        2. Created the mission and launched it in game
        3. The bomb isn't on the aircraft
    validations:
      required: true
  - type: textarea
    id: share
    attributes:
      label: Setup share code
      description: WTFTD → Share → Copy code (starts with WTFTD1.)
      render: text
  - type: input
    id: vehicle
    attributes:
      label: Vehicle and scenario
      placeholder: "F-16C Block 52 — Test flight Britain (jet)"
  - type: textarea
    id: log
    attributes:
      label: Log
      description: 'For crashes or data download problems: the content of %LOCALAPPDATA%\WTFTD\.cache\wtftd.log (Windows) or ~/Library/Application Support/WTFTD/.cache/wtftd.log (macOS). Issues are public: replace your user name in file paths (e.g. C:\Users\<you>, /Users/<you>) before posting.'
      render: text
  - type: input
    id: game
    attributes:
      label: War Thunder version / install
      placeholder: "2.59.0.57, Steam"
