<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="logo.svg?v=3" alt="">
    <div class="brand-text"><b data-i18n="app.title">WTFTD</b><span data-i18n="app.tagline"></span></div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-menu="vehicles" role="tab"><span data-i18n="nav.vehicles"></span></button>
    <button class="tab" data-menu="maps" role="tab"><span data-i18n="nav.maps"></span></button>
    <button class="tab" data-menu="weapons" role="tab"><span data-i18n="nav.weapons"></span></button>
    <button class="tab" data-menu="missions" role="tab"><span data-i18n="nav.missions"></span><span class="tab-count" id="missionCount"></span></button>
    <button class="tab" data-menu="inflight" role="tab"><span data-i18n="nav.inFlight"></span></button>
  </nav>
  <label class="search">
    <svg class="ic"><use href="#i-search"/></svg>
    <input id="search" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="search.placeholder">
    <kbd>Ctrl K</kbd>
  </label>
  <div class="top-actions">
    <div class="status-wrap"><div class="status" id="status"></div><div class="data-menu hidden" id="dataMenu" role="menu"></div></div>
    <button class="icon-btn" id="btnFeedback" data-i18n-title="app.feedback"><svg class="ic"><use href="#i-chat"/></svg></button>
    <button class="icon-btn heart" id="btnSupport" data-i18n-title="app.support"><svg class="ic"><use href="#i-heart"/></svg></button>
    <button class="icon-btn" id="btnTheme" data-i18n-title="theme.toggle"><svg class="ic"><use href="#i-sun"/></svg></button>
    <button class="icon-btn" id="btnSettings" data-i18n-title="settings.title"><svg class="ic"><use href="#i-gear"/></svg></button>
    <button class="btn btn-ghost hidden" id="btnAccount" data-i18n-title="mb.title"><svg class="ic"><use href="#i-user"/></svg><span id="accountName"></span></button>
  </div>
</header>
<nav class="subtabs" role="tablist">
  <button class="subtab" data-view="vehicles" role="tab"><span data-i18n="nav.vehicles"></span></button>
  <button class="subtab" data-view="setups" role="tab"><span data-i18n="nav.myVehicles"></span><span class="tab-count" id="setupCount"></span></button>
  <button class="subtab" data-view="hangar" role="tab"><span data-i18n="nav.hangar"></span><span class="tab-count" id="hangarCount"></span></button>
  <button class="subtab" data-view="changes" role="tab"><span data-i18n="nav.changes"></span><span class="tab-count" id="changeCount"></span></button>
  <button class="subtab" data-view="maps" role="tab"><span data-i18n="nav.maps"></span></button>
  <button class="subtab" data-view="mymaps" role="tab"><span data-i18n="nav.myMaps"></span><span class="tab-count" id="myMapCount"></span></button>
  <button class="subtab" data-view="weapons" role="tab"><span data-i18n="nav.weapons"></span></button>
  <button class="subtab" data-view="myweapons" role="tab"><span data-i18n="nav.myWeapons"></span><span class="tab-count" id="myWeaponCount"></span></button>
  <button class="subtab" data-view="mods" role="tab"><span data-i18n="nav.mods"></span><span class="tab-count" id="modsCount"></span></button>
  <button class="subtab hidden" data-view="overlay" role="tab"><span data-i18n="nav.overlay"></span></button>
  <button class="subtab hidden" data-view="flight" role="tab"><span data-i18n="nav.flight"></span></button>
  <button class="subtab" data-view="battle" role="tab"><span data-i18n="nav.battle"></span></button>
  <button class="subtab" data-view="history" role="tab"><span data-i18n="nav.history"></span></button>
  <button class="subtab hidden" data-view="bench" role="tab"><span data-i18n="nav.bench"></span></button>
  <button class="subtab" data-view="missions" role="tab"><span data-i18n="nav.missions"></span></button>
  <button class="subtab" data-view="challenges" role="tab"><span data-i18n="nav.challenges"></span></button>
</nav>

<div class="update-banner hidden" id="updateBanner"></div>
<main class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-section">
      <div class="cats" id="cats"></div>
    </div>
    <div class="side-section">
      <div class="side-title" data-i18n="filters.nations"></div>
      <div class="nations" id="nations"></div>
    </div>
    <div class="side-section">
      <div class="side-title" data-i18n="filters.rank"></div>
      <div class="ranks" id="ranks"></div>
    </div>
    <div class="side-section">
      <div class="side-title row-between"><span data-i18n="filters.br"></span>
        <div class="seg seg-xs" id="brMode">
          <button data-mode="0" data-i18n="filters.mode.ab"></button><button data-mode="1" data-i18n="filters.mode.rb"></button><button data-mode="2" data-i18n="filters.mode.sb"></button>
        </div>
      </div>
      <div class="range" id="brRange">
        <div class="range-track"><div class="range-fill" id="brFill"></div></div>
        <input type="range" id="brMin" min="1" max="14.3" step="0.1">
        <input type="range" id="brMax" min="1" max="14.3" step="0.1">
      </div>
      <div class="range-labels"><span id="brMinLabel"></span><span id="brMaxLabel"></span></div>
    </div>
    <div class="side-section hidden" id="roleSection">
      <div class="side-title" data-i18n="filters.type"></div>
      <div class="roles" id="roles"></div>
    </div>
    <div class="side-section">
      <div class="side-title" data-i18n="filters.stats"></div>
      <div id="statFilters"></div>
    </div>
    <div class="side-section">
      <div class="side-title" data-i18n="filters.options"></div>
      <label class="switch"><input type="checkbox" id="optFav"><span class="sw"></span><span data-i18n="filters.favorites"></span></label>
      <label class="switch"><input type="checkbox" id="optOwned"><span class="sw"></span><span data-i18n="filters.owned"></span></label>
      <label class="switch"><input type="checkbox" id="optPrem"><span class="sw"></span><span data-i18n="filters.premium"></span></label>
      <label class="switch" data-i18n-title="filters.hiddenHint"><input type="checkbox" id="optHidden"><span class="sw"></span><span data-i18n="filters.hidden"></span></label>
    </div>
    <div class="side-section side-foot">
      <button class="btn btn-ghost btn-block" id="btnReset"><svg class="ic"><use href="#i-refresh"/></svg><span data-i18n="filters.reset"></span></button>
    </div>
  </aside>

  <section class="content">
    <div class="view" id="view-vehicles">
      <div class="results-bar">
        <div class="results-count" id="resultsCount"></div>
        <div class="row gap">
        <div class="seg" id="viewMode"><button data-v="tree"><svg class="ic-sm"><use href="#i-tree"/></svg><span data-i18n="view.tree"></span></button><button data-v="grid"><svg class="ic-sm"><use href="#i-all"/></svg><span data-i18n="view.grid"></span></button></div>
        <label class="select-inline" id="sortWrap"><span data-i18n="filters.sort"></span>
          <select id="sort">
            <option value="br" data-i18n="sort.br"></option>
            <option value="rank" data-i18n="sort.rank"></option>
            <option value="name" data-i18n="sort.name"></option>
            <option value="nation" data-i18n="sort.nation"></option>
            <option value="rarity" data-i18n="sort.rarity"></option>
          </select>
        </label>
        </div>
      </div>
      <div class="tree hidden" id="tree"></div>
      <div class="grid" id="grid"></div>
      <div class="empty hidden" id="gridEmpty"><svg class="ic-xl"><use href="#i-search"/></svg><p data-i18n="results.empty"></p><button class="btn btn-sm hidden" id="gridHangar" data-i18n="nav.hangar"></button></div>
      <div id="sentinel"></div>
    </div>

    <div class="view hidden" id="view-hangar">
      <div class="page-head"><div><h2 data-i18n="nav.hangar"></h2><p class="muted" data-i18n="hg.hint"></p></div></div>
      <div class="seg hg-tabs" id="hgTabs" role="tablist"><button data-tab="owned" data-i18n="hg.tab.owned"></button><button data-tab="lineups" data-i18n="hg.tab.lineups"></button><button data-tab="plan" data-i18n="hg.tab.plan"></button></div>
      <div id="hgBody"></div>
    </div>

    <div class="view hidden" id="view-mods">
      <div class="page-head"><div><h2 data-i18n="nav.mods"></h2><p class="muted" data-i18n="mo.hint"></p></div></div>
      <div class="seg hg-tabs" id="moTabs" role="tablist"><button data-tab="skins" data-i18n="mo.skins"></button><button data-tab="sounds" data-i18n="mo.sounds"></button></div>
      <div id="moBody"></div>
      <input type="file" id="moZip" accept=".zip" hidden>
      <input type="file" id="moFolder" webkitdirectory hidden>
    </div>

    <div class="view hidden" id="view-changes">
      <div class="page-head"><div><h2 data-i18n="ch.title"></h2><p class="muted" data-i18n="ch.hint"></p></div></div>
      <div class="ch-dev" id="chDev"></div>
      <div class="fl-bar hidden" id="chBar">
        <select id="chPatch" data-i18n-title="ch.patch"></select>
        <label class="search ar-search"><svg class="ic"><use href="#i-search"/></svg><input id="chSearch" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="ch.search"></label>
        <select id="chNation" data-i18n-title="filters.nations"></select>
        <select id="chCat" data-i18n-title="filters.type"></select>
        <div class="seg" id="chMode" data-i18n-title="ch.brRows"><button class="active" data-m="" data-i18n="fl.all"></button><button data-m="ab" data-i18n="filters.mode.ab"></button><button data-m="rb" data-i18n="filters.mode.rb"></button><button data-m="sb" data-i18n="filters.mode.sb"></button></div>
        <label class="switch"><input type="checkbox" id="chMine"><span class="sw"></span><span data-i18n="ch.mine"></span></label>
      </div>
      <div id="chBody"></div>
    </div>

    <div class="view hidden" id="view-maps">
      <div class="page-head"><div><h2 data-i18n="maps.title"></h2><p class="muted" data-i18n="maps.hint"></p></div></div>
      <div class="mp-bar">
        <div class="seg" id="mapKinds"></div>
        <label class="search mp-search"><svg class="ic"><use href="#i-search"/></svg><input id="mapSearch" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="maps.search"></label>
        <span class="muted" id="mapCount"></span>
      </div>
      <div id="mapGrid"></div>
    </div>

    <div class="view hidden" id="view-weapons">
      <div class="page-head"><div><h2 data-i18n="arm.title"></h2><p class="muted" data-i18n="arm.hint"></p></div></div>
      <div class="ar-cats" id="arCats"></div>
      <div class="ar-guide" id="arGuide"></div>
      <div class="ar-bar">
        <label class="search ar-search"><svg class="ic"><use href="#i-search"/></svg><input id="arSearch" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="arm.search"></label>
        <select id="arNat"></select>
        <div class="ar-chips" id="arGuid"></div>
        <span class="muted ar-count" id="arCount"></span>
      </div>
      <div class="ar-chips ar-uses" id="arUses"></div>
      <div class="ar-base hidden" id="arBase"></div>
      <div class="ar-scroll" id="arTable"></div>
      <div class="compare-tray ar-tray hidden" id="arTray"></div>
    </div>

    <div class="view hidden" id="view-myweapons">
      <div class="page-head"><div><h2 data-i18n="myw.title"></h2><p class="muted" data-i18n="myw.hint"></p></div></div>
      <div class="list" id="myWeaponList"></div>
    </div>

    <div class="view hidden" id="view-overlay">
      <div class="page-head"><div><h2 data-i18n="ov.title"></h2><p class="muted" data-i18n="ov.hint"></p></div>
        <button class="btn" id="ovReset"><svg class="ic-sm"><use href="#i-refresh"/></svg><span data-i18n="ov.reset"></span></button></div>

          <button class="btn btn-ghost btn-sm hidden" id="edPaste" data-edact="paste"><span data-i18n="editor.paste"></span></button>
          <button class="btn btn-ghost btn-sm" data-edact="reset"><svg class="ic-sm"><use href="#i-refresh"/></svg><span data-i18n="editor.reset"></span></button>
        </div>
        <canvas id="m3Canvas" class="hidden"></canvas>
        <canvas id="edCanvas"></canvas>
        <div class="m3-status hidden" id="m3Status"></div>
        <div class="ed-tip hidden" id="edTip"></div>
        <div class="ed-menu hidden" id="edMenu" role="menu"></div>
        <div class="ed-hint" id="edHint"></div>
        <div class="ed-maphint hidden" id="edMapHint"><svg class="ic-sm"><use href="#i-map"/></svg><span data-i18n="editor.noMap"></span></div>
        <div class="ed-legend"><span><i class="dot player"></i><span data-i18n="editor.you"></span></span><span><i class="dot enemy"></i><span data-i18n="editor.enemies"></span></span><span><i class="dot ally"></i><span data-i18n="editor.allies"></span></span><span><i class="dot other"></i><span data-i18n="editor.scenery"></span></span></div>
      </div>
      <div class="ed-panel" id="edPanel">
        <div id="edInspector"></div>
        <div class="opt-group-title" data-i18n="editor.units"></div>
        <div class="ed-list" id="edList"></div>
      </div>
    </div>
